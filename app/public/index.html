const perSel=()=>sel('ps',[...MS,'2026'].map(m=>[m,m=='2026'?'Tahun 2026':m]),S.per,"S.per=this.value;render()");

const dash=()=>{const p=S.per,k=sum(cI(p),c=>c.p),d=sum(cI(p),c=>c.a),a=arr(),xp=sum(eX(p),e=>e.a);
return `<div class="kp">${[['Penyewa aktif',T.filter(t=>!t.out).length],['Rumah',H.length],['Bilik',R.length],['Berpenghuni',R.filter(r=>occd(r)).length+' / '+R.length]].map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('')}</div><p class="mu">Tempoh: ${perSel()}</p>`+cards([['Dikenakan',fm(d)],['Dikutip',fm(k)],['Tunggakan semasa',fm(sum(a,x=>x.amt))],['Perbelanjaan',fm(xp)],['Untung bersih',fm(k-xp)]])+`<h3>Laporan tunggakan</h3>`+tb(['Penyewa','Bilik','Jumlah tertunggak','Lewat','Tindakan'],a.map(x=>{const t=tn(x.t),r=rm(t.r);return[t.n,hs(r.h).n+' / '+r.no,`<b class="bad2">${fm(x.amt)}</b>`,x.days+' hari',`<button class="b2" onclick="rem(${t.id})">Jana peringatan</button>`]}))+(S.rem?`<div class="cd"><div class="mu">Templat peringatan (cuba disalin ke papan klip, atau ketik untuk pilih teks)</div><textarea readonly rows="4" onclick="this.select()">${S.rem}</textarea></div>`:'')};
