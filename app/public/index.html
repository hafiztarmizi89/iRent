<style>

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}

<script>
const TODAY=new Date('2026-11-18'),MS=['2026-09','2026-10','2026-11'];

const R=[[1,1,'A1','Master',750],[2,1,'A2','Medium',550],[3,1,'A3','Small',450],[4,2,'B1','Master',900],[5,2,'B2','Medium',650],[6,3,'C1','Medium',500],[7,3,'C2','Small',400],[8,3,'C3','Small',400]].map(([id,h,no,ty,rent])=>({id,h,no,ty,rent}));
const T=[[1,'Aiman',1,'012-3456789',1500,'2027-03-31',60],[2,'Siti',2,'011-2345678',1100,'2026-12-15'],[3,'Daniel',3,'013-4567890',900,'2027-01-31'],[4,'Farah',4,'016-5678901',1800,'2027-08-31'],[5,'Hakim',5,'017-6789012',1300,'2027-01-05'],[6,'Lina',6,'014-7890123',1000,'2027-02-28'],[7,'Zul',7,'018-8901234',800,'2027-02-10']].map(([id,n,r,ph,dep,end,park])=>({id,n,r,ph,dep,end,park,months:12,start:addM(end,-12),dt:'Deposit sewa',dd:'2026-06-01'}));
let cid=0,eid=0;const C=[],E=[];
const rm=id=>R.find(r=>r.id==id),hs=id=>H.find(h=>h.id==id),tn=id=>T.find(t=>t.id==id),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function gen(t,m){const r=rm(t.r),h=hs(r.h),add=(ty,a)=>C.push({id:++cid,t:t.id,m,ty,a,p:a});add('Sewa',r.rent);if(h.ut)add('Utiliti',40);if(t.park)add('Parkir',t.park)}
T.forEach(t=>MS.forEach(m=>gen(t,m)));
C.forEach(c=>{if((c.t==3&&c.m>'2026-09')||(c.t==6&&c.m=='2026-11'))c.p=0;if(c.t==5&&c.m=='2026-11'&&c.ty=='Sewa')c.p=300});
const ex=(h,c,a,m,r=null)=>E.push({id:++eid,h,r,c,a,d:m+'-05'});
MS.forEach((m,i)=>{ex(1,'Sewa induk',1800,m);ex(1,'Elektrik',200+i*10,m);ex(1,'Air',60,m);ex(1,'Internet',110,m);ex(2,'Ansuran bank',2400,m);ex(2,'Elektrik',230+i*5,m);ex(2,'Air',70,m);ex(2,'Internet',110,m);ex(3,'Sewa induk',1500,m);ex(3,'Elektrik',170+i*8,m);ex(3,'Air',50,m);ex(3,'Internet',100,m)});
ex(1,'Penyelenggaraan',80,'2026-11',2);ex(3,'Penyelenggaraan',120,'2026-10',7);
const CATS=['Sewa induk','Ansuran bank','Bayaran bank','Elektrik','Air','Internet','Penyelenggaraan','Pembersihan','Cukai / insurans / MC','Gaji / upah','Lain-lain'];
const S={role:'mgr',tab:'dash',per:'2026-11',ten:3,own:'En. Razak',pend:[],pay:[],rem:'',err:'',msg:'',user:null,auth:'login',side:innerWidth>700,edT:null,edR:null};
const INC=['Sewa','Utiliti','Parkir','Penalti','Lain-lain'],UTL=['Elektrik','Air','Internet'];
const U=[{n:'Pengurus Demo',e:'pengurus@demo.my',p:'demo123',role:'mgr'},{n:'En. Razak',e:'owner@demo.my',p:'demo123',role:'own',ref:'En. Razak'},{n:'Daniel',e:'daniel@demo.my',p:'demo123',role:'ten',ref:3}];
const MENU={mgr:[['dash','📊','Dashboard'],['tenmg','👥','Penyewa'],['tnc','📝','Tenancy'],['unit','🏠','Unit dan bilik'],['bayar','💳','Bayaran'],['belanja','🧾','Perbelanjaan'],['lapor','📈','Laporan'],['hist','🕘','Sejarah bilik'],['doc','📑','Dokumen'],['vendor','🔧','Vendor'],['depo','🔑','Deposit keluar'],['agr','📄','Perjanjian'],['adu','📣','Aduan'],['setting','⚙️','Tetapan'],['cfg','🗄️','Pangkalan data']],own:[['own','🏠','Rumah saya']],ten:[['ten','👤','Akaun saya']]};
const nid=a=>Math.max(0,...a.map(x=>x.id))+1;
const $=id=>document.getElementById(id).value,fm=n=>'RM '+Math.round(n).toLocaleString('en-MY');
const due=c=>new Date(c.m+'-07'),cI=p=>C.filter(c=>c.m.startsWith(p)),eX=p=>E.filter(e=>e.d.startsWith(p));
const roomInc=(r,p)=>sum(cI(p).filter(c=>tn(c.t).r==r.id),c=>c.p);
const roomExp=(r,p)=>sum(eX(p).filter(e=>e.h==r.h),e=>e.r==r.id?e.a:e.r==null?e.a/R.filter(x=>x.h==r.h).length:0);
const hInc=(h,p)=>sum(R.filter(r=>r.h==h.id),r=>roomInc(r,p)),hExp=(h,p)=>sum(eX(p).filter(e=>e.h==h.id),e=>e.a);
const po=(h,i,e)=>{if(!h.own)return[0,0];const c=i*h.cm/100;return[c,h.pm=='net'?i-e-c:i*h.pv/100]};
const arr=()=>{const o={};C.filter(c=>c.a>c.p&&due(c)<TODAY).forEach(c=>{const x=o[c.t]??={t:c.t,amt:0,days:0};x.amt+=c.a-c.p;x.days=Math.max(x.days,Math.floor((TODAY-due(c))/864e5))});return Object.values(o)};
const sel=(id,opts,cur,on)=>`<select id="${id}" ${on?`onchange="${on}"`:''}>${opts.map(([v,l])=>`<option value="${v}" ${v==cur?'selected':''}>${l}</option>`).join('')}</select>`;
const tb=(h,rows)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mu">Tiada rekod</td></tr>`}</table></div>`;
const perSel=()=>sel('ps',[...MS,'2026'].map(m=>[m,m=='2026'?'Tahun 2026':m]),S.per,"S.per=this.value;render()");
const stat=c=>c.p>=c.a?'<span class="pill ok">Lunas</span>':`<span class="pill bad">${due(c)<TODAY?'Tertunggak':'Belum'}</span>`;
const occ=r=>r.st=='Renovasi'?'<span class="pill bad">Renovasi</span>':r.st=='Akan kosong'?'<span class="pill">Akan kosong</span>':T.some(t=>t.r==r.id&&!t.out)?'<span class="pill ok">Berpenghuni</span>':'<span class="pill">Kosong</span>';
const cards=a=>`<div class="cards">${a.map(([l,v])=>`<div class="cd"><div class="mu">${l}</div><b>${v}</b></div>`).join('')}</div>`;
function apply(t,a,ty){C.filter(c=>c.t==t&&c.a>c.p&&(!ty||c.ty==ty)).sort((x,y)=>x.m.localeCompare(y.m)).forEach(c=>{const k=Math.min(a,c.a-c.p);c.p+=k;a-=k});return a}
function rem(id){const x=arr().find(a=>a.t==id),t=tn(id),r=rm(t.r);S.rem=`Salam ${t.n}, ini peringatan mesra: sewa bilik ${r.no} (${hs(r.h).n}) sebanyak ${fm(x.amt)} telah tertunggak ${x.days} hari. Sila jelaskan melalui transfer bank dan hantar bukti bayaran. Terima kasih.`;try{navigator.clipboard?.writeText(S.rem).catch(()=>{})}catch(e){}render()}
function addT(){const n=$('nn').trim();if(!n){S.err='Masukkan nama penyewa.';return render()}const t={id:T.length+1,n,r:+$('nr'),ph:$('np'),dep:+$('nd')||0,end:'2027-11-30'};T.push(t);gen(t,'2026-11');render()}
async function recPay(){const a=+$('pa');if(!(a>0)){S.err='Masukkan jumlah bayaran.';return render()}const f=await pick('pf','receipts');if(f===false)return render();const t=+$('pt'),ty=$('py'),left=ty=='Deposit'?0:apply(t,a,ty);S.pay.unshift({d:'2026-11-18',t,a,ty,r:$('pr'),k:$('pk').trim(),f});S.msg=ty=='Deposit'?'Deposit direkod. Deposit tidak dikira sebagai pendapatan.':left>0?'Bayaran direkod. '+fm(left)+' tiada caj '+(PL[ty]||ty).toLowerCase()+' untuk dilunaskan.':'Bayaran direkod dan caj dilunaskan.';render()}
function conf(i){const p=S.pend.splice(i,1)[0];apply(p.t,p.a);S.pay.unshift({d:'2026-11-18',t:p.t,a:p.a,r:p.f});render()}
async function addE(){const v=$('el'),a=+$('ea');if(!(a>0)){S.err='Masukkan jumlah perbelanjaan.';return render()}const id=+v.slice(1);const f=await pick('ef','expenses');if(f===false)return render();E.push({id:++eid,h:v[0]=='h'?id:rm(id).h,r:v[0]=='r'?id:null,c:$('ec'),a,d:$('ed')||'2026-11-18',k:$('ek').trim(),f});render()}
function delE(id){E.splice(E.findIndex(e=>e.id==id),1);render()}
function sendP(){const a=+$('ta');if(!(a>0)){S.err='Masukkan jumlah bayaran.';return render()}S.pend.push({t:S.ten,a,f:document.getElementById('tf').files[0]?.name||'tiada fail'});S.msg='Bukti dihantar. Menunggu pengesahan pengurus.';render()}
const dash=()=>{const p=S.per,k=sum(cI(p),c=>c.p),d=sum(cI(p),c=>c.a),a=arr(),xp=sum(eX(p),e=>e.a);
return `<div class="kp">${[['Penyewa aktif',T.filter(t=>!t.out).length],['Rumah',H.length],['Bilik',R.length],['Berpenghuni',R.filter(r=>T.some(t=>t.r==r.id&&!t.out)).length+' / '+R.length]].map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('')}</div><p class="mu">Tempoh: ${perSel()}</p>`+cards([['Dikenakan',fm(d)],['Dikutip',fm(k)],['Tunggakan semasa',fm(sum(a,x=>x.amt))],['Perbelanjaan',fm(xp)],['Untung bersih',fm(k-xp)]])+`<h3>Laporan tunggakan</h3>`+tb(['Penyewa','Bilik','Jumlah tertunggak','Lewat','Tindakan'],a.map(x=>{const t=tn(x.t),r=rm(t.r);return[t.n,hs(r.h).n+' / '+r.no,`<b class="bad2">${fm(x.amt)}</b>`,x.days+' hari',`<button class="b2" onclick="rem(${t.id})">Jana peringatan</button>`]}))+(S.rem?`<div class="cd"><div class="mu">Templat peringatan (cuba disalin ke papan klip, atau ketik untuk pilih teks)</div><textarea readonly rows="4" onclick="this.select()">${S.rem}</textarea></div>`:'')};
const bilik=()=>{const v=R.filter(r=>!T.some(t=>t.r==r.id));return (v.length?`<div class="cd"><b>Daftar penyewa baru</b><div class="fr">${sel('nr',v.map(r=>[r.id,hs(r.h).n+' / '+r.no+' ('+fm(r.rent)+')']))}<input id="nn" placeholder="Nama"><input id="np" placeholder="No. telefon"><input id="nd" type="number" placeholder="Deposit (RM)"><button onclick="addT()">Daftar penyewa</button></div><div class="er">${S.err}</div></div>`:'')+`<h3>Senarai bilik</h3>`+tb(['Rumah','Bilik','Jenis','Sewa','Status','Penyewa','Telefon','Deposit','Tamat kontrak'],R.map(r=>{const t=T.find(t=>t.r==r.id);return[hs(r.h).n,r.no,r.ty,fm(r.rent),occ(r),t?t.n:'–',t?t.ph||'–':'–',t?fm(t.dep||0):'–',t?t.end||'–':'–']}))};
const bayar=()=>`<div class="cd"><b>Rekod bayaran penyewa</b><div class="fr">${sel('pt',T.map(t=>[t.id,t.n+' / '+(t.r?rm(t.r).no:'–')+' (baki '+fm(sum(C.filter(c=>c.t==t.id),c=>c.a-c.p))+')']))}<label class="mu">Jenis bayaran ${sel('py',[...INC,'Deposit'].map(v=>[v,PL[v]||v]))}</label><input id="pa" type="number" placeholder="Jumlah (RM)"><input id="pr" placeholder="Rujukan transfer"><input id="pk" placeholder="Remark"><label class="mu">Resit (PDF/JPEG) <input id="pf" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg"></label><button onclick="recPay()">Rekod bayaran</button></div><div class="er">${S.err}</div><div class="ok2">${S.msg}</div></div><div class="cd"><b>Tambah caj</b><div class="fr">${sel('ct',T.map(t=>[t.id,t.n]))}${sel('cy',INC.map(c=>[c,c]))}<input id="cm" type="number" placeholder="Jumlah (RM)"><button onclick="addC()">Tambah caj</button></div></div><h3>Bukti bayaran menunggu pengesahan</h3>`+tb(['Penyewa','Jumlah','Fail','Tindakan'],S.pend.map((p,i)=>[tn(p.t).n,fm(p.a),p.f,`<button class="b2" onclick="conf(${i})">Sahkan</button>`]))+`<h3>Bayaran direkod (sesi ini)</h3>`+tb(['Tarikh','Penyewa','Jenis','Jumlah','Rujukan','Remark','Resit'],S.pay.map(p=>[p.d,tn(p.t).n,PL[p.ty]||p.ty||'Semua caj',fm(p.a),esc(p.r||'–'),esc(p.k||'–'),rcp(p.f)]));
const belanja=()=>`<div class="cd"><b>Tambah perbelanjaan</b><div class="fr">${sel('el',H.flatMap(h=>[['h'+h.id,h.n+' (seluruh rumah)'],...R.filter(r=>r.h==h.id).map(r=>['r'+r.id,h.n+' / '+r.no])]))}<label class="mu">Jenis perbelanjaan ${sel('ec',CATS.map(c=>[c,c]))}</label><input id="ea" type="number" placeholder="Jumlah (RM)"><input id="ed" type="date" value="2026-11-18"><input id="ek" placeholder="Remark"><label class="mu">Resit (PDF/JPEG) <input id="ef" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg"></label><button onclick="addE()">Simpan</button></div><div class="er">${S.err}</div></div><h3>Perbelanjaan terkini</h3>`+tb(['Tarikh','Lokasi','Jenis','Jumlah','Remark','Resit',''],[...E].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,12).map(e=>[e.d,hs(e.h).n+(e.r?' / '+rm(e.r).no:''),e.c,fm(e.a),esc(e.k||'–'),rcp(e.f),`<button class="b2" onclick="delE(${e.id})">Padam</button>`]));
const lapor=()=>{const p=S.per,nb=v=>`<b class="${v<0?'bad2':''}">${fm(v)}</b>`;return `<p class="mu">Tempoh: ${perSel()}</p><div class="fr"><button onclick="expXl()">Eksport Excel</button><button onclick="expPdf()">Eksport PDF</button></div><h3>Pendapatan vs perbelanjaan, dan payout Owner</h3>`+tb(['Rumah','Pendapatan','Perbelanjaan','Untung','Komisen','Payout Owner'],H.map(h=>{const i=hInc(h,p),e=hExp(h,p),[c,o]=po(h,i,e);return[h.n,fm(i),fm(e),nb(i-e),h.own?fm(c):'–',h.own?fm(o):'–']}))+`<h3>Untung per bilik</h3>`+tb(['Rumah','Bilik','Pendapatan','Kos (agihan)','Untung'],R.map(r=>{const i=roomInc(r,p),e=roomExp(r,p);return[hs(r.h).n,r.no,fm(i),fm(e),nb(i-e)]}))+`<h3>Perbelanjaan utiliti per rumah</h3>`+tb(['Rumah',...UTL,'Jumlah'],H.map(h=>{const f=c=>sum(eX(p).filter(e=>e.h==h.id&&e.c==c),e=>e.a);return[h.n,...UTL.map(c=>fm(f(c))),fm(sum(UTL,f))]}))+`<p class="mu">Kos rumah yang dikongsi dibahagi sama rata antara bilik. Kos khusus satu bilik dikenakan terus kepada bilik itu.</p>`};
const TABS=[['dash','Dashboard'],['bilik','Bilik dan penyewa'],['bayar','Bayaran'],['belanja','Perbelanjaan'],['lapor','Laporan']];

function render(){render0();clearTimeout(tmr);tmr=setTimeout(save,500)}
async function poll(){if(S.off||busy||snap()!=last)return;try{const j=await(await fetch('api/state')).json();if(j.data&&j.rev!=rev){rev=j.rev;putS(j.data);last=snap();render0()}}catch(e){}}
const cfgp=()=>{if(!S.cfg){fetch('api/config').then(r=>r.json()).then(c=>{S.cfg=c;render()}).catch(()=>{S.cfg={off:1};render()});return '<p class="mu">Memuatkan konfigurasi...</p>'}const c=S.cfg;if(c.off)return '<p class="er">Sistem dibuka tanpa pelayan, jadi konfigurasi tidak tersedia.</p>';return cards([['Versi data (rev)',c.rev],['Saiz pangkalan data',(c.dbSize/1024).toFixed(1)+' KB'],['Port',c.port],['Kata laluan akses',c.secured?'Ya':'Tidak ditetapkan']])+`<div class="cd"><b>Titik pangkalan data dan lampiran</b><div class="mu">Disimpan dalam config/config.json. Boleh juga diedit terus pada fail itu (mulakan semula pelayan).</div><div class="fr" style="flex-direction:column"><label class="mu">Laluan pangkalan data <input id="cdb" style="width:100%" value="${esc(c.dbPath)}"></label><label class="mu">Folder lampiran <input id="cat" style="width:100%" value="${esc(c.attachPath)}"></label><button onclick="saveCfg()">Simpan dan tukar</button></div><div class="mu">Aktif: ${esc(c.dbResolved)} | ${esc(c.attachResolved)}</div><div class="mu">Jika fail pangkalan data baharu kosong, data semasa disalin ke dalamnya.</div><div class="er">${S.err}</div><div class="ok2">${S.msg}</div></div>`};
async function saveCfg(){const r=await fetch('api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dbPath:$('cdb').trim(),attachPath:$('cat').trim()})}),j=await r.json();S.cfg=null;if(!r.ok)S.err=j.error;else{S.msg='Konfigurasi disimpan dan pangkalan data dimuat semula.';await loadDb(true)}render()}
R.forEach((r,i)=>{r.cat=i%2?2:1;r.det=i%3==0?[1,3,5]:[2,4,6];r.rs=i==1?2:i==3?1:null});
const rlab=r=>{const x=RS.find(y=>y.id==r.rs);return x?' ['+x.n+']':''};
const chips=r=>(r.det||[]).map(id=>DET.find(d=>d.id==id)).filter(Boolean).map(d=>`<span class="pill">${esc(d.n)}</span>`).join(' ')||'\u2013';
const LS={R:{l:'Jenis bilik',a:RT,s:1,use:n=>R.filter(r=>r.ty==n).length,ren:(o,n)=>R.forEach(r=>{if(r.ty==o)r.ty=n})},
D:{l:'Jenis deposit',a:DT,s:1,use:n=>T.filter(t=>t.dt==n).length,ren:(o,n)=>T.forEach(t=>{if(t.dt==o)t.dt=n})},
X:{l:'Butiran bilik (cth. Aircond, Fully furnished, Wardrobe)',a:DET,use:id=>R.filter(r=>(r.det||[]).includes(id)).length},
K:{l:'Kategori bilik (cth. Single room, Sharing room)',a:CAT,use:id=>R.filter(r=>r.cat==id).length},
S:{l:'Sekatan bilik (cth. Male only, Female only, Family)',a:RS,use:id=>R.filter(r=>r.rs==id).length}};
const lrow=k=>{const c=LS[k];return `<div class="cd"><b>${c.l}</b><div class="mu">Tukar nama terus pada kotak. Nama baharu dikemas kini pada semua bilik yang menggunakannya.</div>`+c.a.map((x,i)=>`<div class="fr"><input value="${esc(c.s?x:x.n)}" onchange="lren('${k}',${i},this.value)">${k=='S'?`<select onchange="rsg(${x.id},this.value)">${[['','Tiada had jantina'],['Lelaki','Hanya lelaki'],['Perempuan','Hanya perempuan']].map(([v,l])=>`<option value="${v}" ${x.g==v?'selected':''}>${l}</option>`).join('')}</select>`:''}<span class="mu">${c.use(c.s?x:x.id)} bilik/rekod</span><button class="b2" onclick="ldel('${k}',${i})">Buang</button></div>`).join('')+`<div class="fr"><input id="l${k}" placeholder="Tambah baharu"><button onclick="ladd('${k}')">Tambah</button></div></div>`};
const nmOf=(c,y)=>c.s?y:y.n;
function lren(k,i,v){const c=LS[k],a=c.a,n=v.trim();if(!n){S.err='Nama tidak boleh kosong.';return render()}if(a.some((y,j)=>j!=i&&nmOf(c,y).toLowerCase()==n.toLowerCase())){S.err='Nama "'+n+'" sudah digunakan.';return render()}if(c.s){const o=a[i];a[i]=n;c.ren(o,n)}else a[i].n=n;render()}
function ldel(k,i){const c=LS[k],x=c.a[i],u=c.use(c.s?x:x.id);if(u){S.err='Tidak boleh dibuang: digunakan oleh '+u+' bilik/rekod. Tukar nama, atau alih keluar penggunaannya dahulu.';return render()}c.a.splice(i,1);render()}
function ladd(k){const c=LS[k],v=$('l'+k).trim();if(!v||c.a.some(y=>nmOf(c,y).toLowerCase()==v.toLowerCase())){S.err='Isi nama yang belum wujud.';return render()}c.a.push(c.s?v:{id:nid(c.a),n:v});render()}
function rsg(id,g){RS.find(x=>x.id==id).g=g;render()}
const unit3=()=>{const e=S.edR?rm(S.edR):null,eh=S.edH?hs(S.edH):null,o=(a,cur,none)=>`<option value="">${none}</option>`+a.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${esc(x.n)}</option>`).join('');
return `<div class="cd"><b>${eh?'Kemas kini rumah':'Tambah rumah'}</b><div class="fr"><input id="hn" placeholder="Nama rumah" value="${eh?esc(eh.n):''}"><input id="ho" placeholder="Nama Owner (kosong jika milik sendiri)" value="${eh&&eh.own?esc(eh.own):''}"><input id="hp" type="tel" placeholder="Telefon Owner" value="${eh&&eh.oph?esc(eh.oph):''}"><button onclick="saveH()">${eh?'Simpan':'Tambah rumah'}</button>${eh?'<button onclick="S.edH=null;render()">Batal</button>':''}</div></div>`
+`<div class="cd"><b>${e?'Kemas kini bilik':'Tambah bilik'}</b><div class="fr">${sel('uh',e?[[e.h,hs(e.h).n]]:H.map(h=>[h.id,h.n]),e?e.h:'')}<input id="un" placeholder="Nama / no. bilik" value="${e?esc(e.no):''}">${sel('ut',RT.map(x=>[x,x]),e?e.ty:'')}<select id="uc">${o(CAT,e&&e.cat,'Kategori')}</select><select id="ur2">${o(RS,e&&e.rs,'Tiada sekatan')}</select><input id="ur" type="number" placeholder="Sewa (RM)" value="${e?e.rent:''}"><input id="uk" placeholder="Remark" value="${e?esc(e.rk||''):''}">${e?`<label class="mu">Status ${sel('us',[['','Ikut penghuni'],['Renovasi','Renovasi'],['Akan kosong','Akan kosong']],e.st||'')}</label>`:''}</div><div class="fr">${DET.map(d=>`<label class="mu"><input type="checkbox" id="dt_${d.id}" ${e&&(e.det||[]).includes(d.id)?'checked':''}> ${esc(d.n)}</label>`).join('')}</div><div class="fr"><button onclick="saveR()">${e?'Simpan':'Tambah bilik'}</button>${e?'<button onclick="S.edR=null;render()">Batal</button>':''}</div><div class="er">${S.err}</div></div>`
+`<h3>Rumah</h3>`+tb(['Rumah','Owner','Bilik','Tindakan'],H.map(h=>[esc(h.n),esc(h.own||'Milik sendiri'),R.filter(r=>r.h==h.id).length,`<button class="b2" onclick="S.edH=${h.id};render()">Kemas kini</button> <button class="b2" onclick="delH(${h.id})">Padam</button>`]))
+`<h3>Senarai unit dan bilik</h3>`+tb(['Rumah','Bilik','Jenis','Kategori','Sekatan','Butiran','Sewa','Status','Remark','Tindakan'],R.map(r=>{const c=CAT.find(x=>x.id==r.cat),x=RS.find(y=>y.id==r.rs);return[esc(hs(r.h).n),esc(r.no),esc(r.ty),c?esc(c.n):'\u2013',x?esc(x.n):'\u2013',chips(r),fm(r.rent),occ(r),esc(r.rk||'\u2013'),`<button class="b2" onclick="S.edR=${r.id};render()">Kemas kini</button> <button class="b2" onclick="delR(${r.id})">Padam</button>`]}))};
function saveH(){const n=$('hn').trim(),o=$('ho').trim(),ph=$('hp').trim();if(!n){S.err='Masukkan nama rumah.';return render()}if(H.some(h=>h.id!=S.edH&&h.n.toLowerCase()==n.toLowerCase())){S.err='Nama rumah "'+n+'" sudah digunakan.';return render()}if(o&&dg(ph).length<9){S.err='Masukkan telefon Owner (digunakan untuk log masuk).';return render()}
if(S.edH){const h=hs(S.edH),old=h.own;Object.assign(h,{n,own:o||null,oph:ph});if(o&&!h.cm){h.cm=10;h.pm='net'}if(old&&old!=o)U.forEach(u=>{if(u.role=='own'&&u.ref==old)u.ref=o});S.edH=null}else H.push(o?{id:nid(H),n,own:o,oph:ph,cm:10,pm:'net'}:{id:nid(H),n,own:null});render()}
function delH(id){if(R.some(r=>r.h==id)||E.some(e=>e.h==id)||VB.some(b=>b.h==id)){S.err='Rumah ini masih mempunyai bilik atau rekod perbelanjaan, jadi tidak boleh dipadam.';return render()}H.splice(H.findIndex(h=>h.id==id),1);render()}
function saveR(){const no=$('un').trim(),rent=+$('ur'),h=S.edR?rm(S.edR).h:+$('uh');if(!no||!(rent>0)){S.err='Isi nama bilik dan sewa.';return render()}if(R.some(x=>x.h==h&&x.id!=S.edR&&x.no.trim().toLowerCase()==no.toLowerCase())){S.err='Nama bilik "'+no+'" sudah digunakan dalam rumah ini.';return render()}const f={no,ty:$('ut'),rent,rk:$('uk').trim(),cat:+$('uc')||null,rs:+$('ur2')||null,det:DET.filter(d=>document.getElementById('dt_'+d.id).checked).map(d=>d.id)};if(S.edR)Object.assign(rm(S.edR),f,{st:$('us')});else R.push({id:nid(R),h,...f});S.edR=null;render()}
function delR(id){if(T.some(t=>t.r==id)||TH.some(x=>x.r==id)||E.some(e=>e.r==id)||VB.some(b=>b.r==id)){S.err='Bilik ini ada sejarah penyewa atau rekod kewangan, jadi tidak boleh dipadam. Anda boleh menukar namanya atau menetapkan status Renovasi.';return render()}R.splice(R.findIndex(r=>r.id==id),1);render()}
function regTn(){const t=tn(+$('tt1')),r=+$('tu1'),s=$('ts'),m=+$('tm');if(!t||!r||!s||!(m>0)){S.err='Pilih penyewa dan unit, serta isi tarikh mula dan tempoh kontrak.';return render()}const rs=RS.find(x=>x.id==rm(r).rs);if(rs&&rs.g){if(!t.sx){S.err='Bilik ini "'+rs.n+'". Isi jantina penyewa di menu Penyewa dahulu.';return render()}if(t.sx!=rs.g){S.err='Bilik ini "'+rs.n+'" tetapi jantina penyewa ialah '+t.sx+'.';return render()}}Object.assign(t,{r,start:s,months:m,end:addM(s,m),out:false});if(!C.some(c=>c.t==t.id&&c.m=='2026-11'))gen(t,'2026-11');render()}
(async()=>{await loadDb();render();setInterval(poll,15000)})();
</script></body></html>
